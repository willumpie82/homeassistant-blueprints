blueprint:
  name: Z-Wave.Me WALLC-S Scene Controller (v1.1)
  description: >
    Control actions for the Z-Wave.Me WALLC-S 4-button wall controller.
    Supports single press, hold, and double press actions.
    Lamp mode includes dimming functionality.
  domain: automation
  input:
    device:
      name: Z-Wave.Me WALLC-S device
      description: Select the device to use
      selector:
        device:
          integration: zwave_js

    # ==== Lamp mode settings ====
    left_mode:
      name: Left Button Pair Mode
      description: Choose between Lamp or Custom
      default: lamp
      selector:
        select:
          options: ["lamp", "custom"]

    left_lamp:
      name: Left Pair Lamp (Lamp mode)
      default: []
      selector:
        entity:
          domain: light

    left_double_down_level:
      name: Left Double Down Brightness %
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    right_mode:
      name: Right Button Pair Mode
      description: Choose between Lamp or Custom
      default: lamp
      selector:
        select:
          options: ["lamp", "custom"]

    right_lamp:
      name: Right Pair Lamp (Lamp mode)
      default: []
      selector:
        entity:
          domain: light

    right_double_down_level:
      name: Right Double Down Brightness %
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # ==== Dimming config ====
    dim_step:
      name: Dimming Step Size (%)
      description: How many % brightness to increase/decrease per step
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"

    dim_delay:
      name: Dimming Step Delay (seconds)
      description: Delay between each dimming step
      default: 0.6
      selector:
        number:
          min: 0.1
          max: 2
          step: 0.1
          unit_of_measurement: s

    # ==== Custom mode actions ====
    button1_single:
      name: Button 1 Single Press
      default: []
      selector:
        action: {}
    button1_hold:
      name: Button 1 Hold
      default: []
      selector:
        action: {}
    button1_double:
      name: Button 1 Double Press
      default: []
      selector:
        action: {}

    button2_single:
      name: Button 2 Single Press
      default: []
      selector:
        action: {}
    button2_hold:
      name: Button 2 Hold
      default: []
      selector:
        action: {}
    button2_double:
      name: Button 2 Double Press
      default: []
      selector:
        action: {}

    button3_single:
      name: Button 3 Single Press
      default: []
      selector:
        action: {}
    button3_hold:
      name: Button 3 Hold
      default: []
      selector:
        action: {}
    button3_double:
      name: Button 3 Double Press
      default: []
      selector:
        action: {}

    button4_single:
      name: Button 4 Single Press
      default: []
      selector:
        action: {}
    button4_hold:
      name: Button 4 Hold
      default: []
      selector:
        action: {}
    button4_double:
      name: Button 4 Double Press
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

triggers:
  # Button 1 (Top Left)
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "001"
      value: 0
    id: button1_single
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "001"
      value: 2
    id: button1_hold
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "001"
      value: 3
    id: button1_double

  # Button 2 (Bottom Left)
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "005"
      value: 0
    id: button2_single
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "005"
      value: 2
    id: button2_hold
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "005"
      value: 3
    id: button2_double

  # Button 3 (Top Right)
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "002"
      value: 0
    id: button3_single
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "002"
      value: 2
    id: button3_hold
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "002"
      value: 3
    id: button3_double

  # Button 4 (Bottom Right)
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "006"
      value: 0
    id: button4_single
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "006"
      value: 2
    id: button4_hold
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: !input device
      property: scene
      property_key: "006"
      value: 3
    id: button4_double

actions:
  - choose:
      # ===== Left Pair Lamp Mode =====
      - conditions:
          - condition: template
            value_template: "{{ left_mode == 'lamp' and trigger.id == 'button1_single' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input left_lamp
      - conditions:
          - condition: template
            value_template: "{{ left_mode == 'lamp' and trigger.id == 'button1_hold' }}"
        sequence:
          - repeat:
              until:
                - condition: trigger
                  id: button1_release
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input left_lamp
                  data:
                    brightness_step_pct: "{{ dim_step }}"
                - delay: "{{ dim_delay }}"
      - conditions:
          - condition: template
            value_template: "{{ left_mode == 'lamp' and trigger.id == 'button1_double' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input left_lamp
            data:
              brightness_pct: 100
      - conditions:
          - condition: template
            value_template: "{{ left_mode == 'lamp' and trigger.id == 'button2_single' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input left_lamp
      - conditions:
          - condition: template
            value_template: "{{ left_mode == 'lamp' and trigger.id == 'button2_hold' }}"
        sequence:
          - repeat:
              until:
                - condition: trigger
                  id: button2_release
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input left_lamp
                  data:
                    brightness_step_pct: "-{{ dim_step }}"
                - delay: "{{ dim_delay }}"
      - conditions:
          - condition: template
            value_template: "{{ left_mode == 'lamp' and trigger.id == 'button2_double' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input left_lamp
            data:
              brightness_pct: !input left_double_down_level

      # ===== Right Pair Lamp Mode =====
      - conditions:
          - condition: template
            value_template: "{{ right_mode == 'lamp' and trigger.id == 'button3_single' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input right_lamp
      - conditions:
          - condition: template
            value_template: "{{ right_mode == 'lamp' and trigger.id == 'button3_hold' }}"
        sequence:
          - repeat:
              until:
                - condition: trigger
                  id: button3_release
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input right_lamp
                  data:
                    brightness_step_pct: "{{ dim_step }}"
                - delay: "{{ dim_delay }}"
      - conditions:
          - condition: template
            value_template: "{{ right_mode == 'lamp' and trigger.id == 'button3_double' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input right_lamp
            data:
              brightness_pct: 100
      - conditions:
          - condition: template
            value_template: "{{ right_mode == 'lamp' and trigger.id == 'button4_single' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input right_lamp
      - conditions:
          - condition: template
            value_template: "{{ right_mode == 'lamp' and trigger.id == 'button4_hold' }}"
        sequence:
          - repeat:
              until:
                - condition: trigger
                  id: button4_release
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input right_lamp
                  data:
                    brightness_step_pct: "-{{ dim_step }}"
                - delay: "{{ dim_delay }}"
      - conditions:
          - condition: template
            value_template: "{{ right_mode == 'lamp' and trigger.id == 'button4_double' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input right_lamp
            data:
              brightness_pct: !input right_double_down_level

      # ===== Custom Mode =====
      - conditions:
          - condition: template
            value_template: "{{ left_mode == 'custom' or right_mode == 'custom' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: trigger
                    id: button1_single
                sequence: !input button1_single
              - conditions:
                  - condition: trigger
                    id: button1_hold
                sequence: !input button1_hold
              - conditions:
                  - condition: trigger
                    id: button1_double
                sequence: !input button1_double
              - conditions:
                  - condition: trigger
                    id: button2_single
                sequence: !input button2_single
              - conditions:
                  - condition: trigger
                    id: button2_hold
                sequence: !input button2_hold
              - conditions:
                  - condition: trigger
                    id: button2_double
                sequence: !input button2_double
              - conditions:
                  - condition: trigger
                    id: button3_single
                sequence: !input button3_single
              - conditions:
                  - condition: trigger
                    id: button3_hold
                sequence: !input button3_hold
              - conditions:
                  - condition: trigger
                    id: button3_double
                sequence: !input button3_double
              - conditions:
                  - condition: trigger
                    id: button4_single
                sequence: !input button4_single
              - conditions:
                  - condition: trigger
                    id: button4_hold
                sequence: !input button4_hold
              - conditions:
                  - condition: trigger
                    id: button4_double
                sequence: !input button4_double