blueprint:
  name: Shelly Detached Input - Switch or Button Mode v1.3
  domain: automation
  description: "# 🔌 Shelly Detached Input – Switch or Button Mode\n\
  **Version: 1.3**\n\n\
  ✨ Control lights or run custom actions using a Shelly device configured in **detached mode**.\n\
  This blueprint combines **classic wall switches** and **modern button events** into one flexible automation.\n\n\
  ---\n\n\
  ## 🔧 Input Modes\n\n\
  🔘 **Switch mode**\n\ 
  - Uses a `binary_sensor`\n\
  - 🔁 Toggles on every OFF ↔ ON state change\n\n\
  🖲️ **Button mode**\n\
  - Uses a Shelly `event` entity\n\
  - 🎯 Supported events:\n\
    - 🟢 `single_push`\n\
    - 🔵 `double_push`\n\
    - 🟣 `long_push`\n\n\
  ---\n\n\
  ## 💡 Action Modes\n\n\
  💡 **Lamp mode**\n\
  - 🔘 Switch mode → toggle the lamp\n\
  - 🖲️ Button mode:\n\
    - 🟢 single press → toggle\n\
    - 🔵 double press → 100% brightness\n\n\
  🧩 **Custom mode**\n\
  - Define your own automations per switch state or button press\n\
  - Combine with scenes, scripts, or advanced logic\n\n\
  ---\n\n\
  ## ⚠️ Important – Required Inputs\n\n\
  🚧 Home Assistant requires **all trigger entities to be valid at all times**.\n\n\
  This means:\n\
  - 🔘 **Switch mode** → switch input is **required**\n\
  - 🖲️ **Button mode** → button event entity is **required**\n\
  - ℹ️ Other inputs may still need a value, even if they are ignored\n\n\
  👉 **If an input is not relevant for your selected mode, simply select any entity.**\n\
  🚫 It will **NOT** be used.\n\n\
  🧠 This is a Home Assistant limitation — **not** a blueprint error.\n\n\
  ---\n\n\
  <details>\n\
  <summary><b>🧠 How this blueprint works</b></summary>\n\n\
  - 👂 Listens for either:\n\
    - 🔘 state changes (switch mode)\n\
    - 🖲️ button events (button mode)\n\
  - 🧭 Routes the trigger based on your selected mode\n\
  - ⚙️ Executes only the relevant actions\n\
  - ✅ Optionally triggers a Shelly confirm output for feedback\n\n\
  </details>\n\n\
  <details>\n\
  <summary><b>📦 Supported Shelly devices</b></summary>\n\n\
  - 🧱 Shelly Gen3\n\
  - 🧱 Shelly Gen4\n\
  - 🔧 Devices configured in **detached input mode**\n\n\
  </details>\n"

  input:
    ###########################################################################
    # GENERAL
    ###########################################################################
    general:
      name: General configuration
      collapsed: false
      input:
        input_mode:
          name: Input mode
          description: >
            Select how the Shelly input is configured.
            - switch: detached switch using a binary_sensor
            - button: event-based button input
          default: switch
          selector:
            select:
              options:
                - switch
                - button

        action_mode:
          name: Action mode
          description: >
            Choose whether this automation controls a lamp directly
            or runs custom actions.
          default: lamp
          selector:
            select:
              options:
                - lamp
                - custom

    ###########################################################################
    # SWITCH MODE CONFIGURATION
    ###########################################################################
    switch_config:
      name: Switch configuration
      collapsed: true
      input:
        primary_input:
          name: "[Switch mode] Primary switch input (required)"
          description: >
            REQUIRED when Input mode is set to 'switch'.

            If you are using Button mode, select any binary_sensor here.
            This input will be ignored.
          selector:
            entity:
              domain: binary_sensor

        custom_on:
          name: "[Switch][Custom] ON action"
          description: >
            Executed when the switch goes from OFF to ON
            and Action mode is set to 'custom'.
          default: []
          selector:
            action: {}

        custom_off:
          name: "[Switch][Custom] OFF action"
          description: >
            Executed when the switch goes from ON to OFF
            and Action mode is set to 'custom'.
          default: []
          selector:
            action: {}

    ###########################################################################
    # BUTTON MODE CONFIGURATION
    ###########################################################################
    button_config:
      name: Button configuration
      collapsed: true
      input:
        button_event:
          name: "[Button mode] Button event entity (required)"
          description: >
            REQUIRED when Input mode is set to 'button'.

            If you are using Switch mode, select any event entity here.
            This input will be ignored.
          selector:
            entity:
              domain: event

        custom_single:
          name: "[Button][Custom] Single press action"
          default: []
          selector:
            action: {}

        custom_double:
          name: "[Button][Custom] Double press action"
          default: []
          selector:
            action: {}

        custom_long:
          name: "[Button][Custom] Long press action"
          default: []
          selector:
            action: {}

    ###########################################################################
    # LAMP CONFIGURATION
    ###########################################################################
    lamp_config:
      name: Lamp configuration
      collapsed: true
      input:
        lamp_entity:
          name: Lamp entity
          description: >
            Used when Action mode is set to 'lamp'.

            Switch mode:
            - toggle on every state change

            Button mode:
            - single press → toggle
            - double press → 100% brightness
          selector:
            entity:
              domain: light

    ###########################################################################
    # OPTIONAL CONFIRM SWITCH
    ###########################################################################
    confirm_config:
      name: Optional confirm switch
      collapsed: true
      input:
        confirm_switch:
          name: Confirm switch
          description: >
            Optional switch that will be turned on after an action.
            Typically used with Shelly confirm outputs.
            The Shelly will reset this switch automatically.
          selector:
            entity:
              domain: switch

###############################################################################
# TRIGGERS
###############################################################################
trigger:
  - platform: state
    entity_id: !input primary_input
    from: "off"
    to: "on"
    id: switch_on

  - platform: state
    entity_id: !input primary_input
    from: "on"
    to: "off"
    id: switch_off

  - platform: event
    event_type: shelly_button_event
    id: button_event

###############################################################################
# CONDITIONS
###############################################################################
condition:
  - condition: template
    value_template: >
      {{ trigger.platform != 'state'
         or trigger.from_state.state in ['on','off'] }}

###############################################################################
# ACTIONS
###############################################################################
action:
  - choose:
      #########################################################################
      # SWITCH MODE
      #########################################################################
      - conditions:
          - condition: template
            value_template: "{{ input_mode == 'switch' }}"
        sequence:
          - choose:
              # OFF → ON
              - conditions:
                  - condition: trigger
                    id: switch_on
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'lamp' }}"
                        sequence:
                          - service: light.toggle
                            target:
                              entity_id: !input lamp_entity
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'custom' }}"
                        sequence: !input custom_on

              # ON → OFF
              - conditions:
                  - condition: trigger
                    id: switch_off
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'custom' }}"
                        sequence: !input custom_off

      #########################################################################
      # BUTTON MODE
      #########################################################################
      - conditions:
          - condition: template
            value_template: "{{ input_mode == 'button' }}"
        sequence:
          - choose:
              # SINGLE PUSH
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.event.data.event_type == 'single_push' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'lamp' }}"
                        sequence:
                          - service: light.toggle
                            target:
                              entity_id: !input lamp_entity
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'custom' }}"
                        sequence: !input custom_single

              # DOUBLE PUSH
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.event.data.event_type == 'double_push' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'lamp' }}"
                        sequence:
                          - service: light.turn_on
                            data:
                              brightness_pct: 100
                            target:
                              entity_id: !input lamp_entity
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'custom' }}"
                        sequence: !input custom_double

              # LONG PUSH
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.event.data.event_type == 'long_push' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ action_mode == 'custom' }}"
                        sequence: !input custom_long

  ###########################################################################
  # OPTIONAL CONFIRM SWITCH
  ###########################################################################
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ confirm_switch is not none }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input confirm_switch

mode: single